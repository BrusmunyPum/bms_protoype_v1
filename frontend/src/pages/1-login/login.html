<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ចូលប្រព័ន្ធ</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#24692D",
                        'primary-light': "#2e7d38",
                        'primary-dark': "#1b5223",
                        'brand-navy': "#14213d",
                    },
                    fontFamily: {
                        sans: ["'Kantumruy Pro'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../styles/custom.css">
</head>

<body class="bg-gradient-to-br from-[#1b5223] via-[#24692D] to-[#14421b] min-h-screen font-sans flex items-center justify-center p-4 md:p-8 select-none">

    <!-- Main Content / Login Card (Centered) -->
    <main class="w-full max-w-4xl flex items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl border border-white/20 overflow-hidden w-full grid grid-cols-1 md:grid-cols-2">

            <!-- Left Side: City Skyline with Brand Story -->
            <div class="relative h-64 md:h-auto min-h-[420px] bg-slate-900 overflow-hidden group">
                <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80"
                    alt="City Skyline"
                    class="w-full h-full object-cover object-center transform scale-105 group-hover:scale-110 transition-transform duration-700 ease-out" />
                <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/40 to-black/20 flex flex-col justify-end p-8 text-white">
                    <div class="w-14 h-14 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 p-2 shadow-xl mb-4 flex items-center justify-center">
                        <img src="../../assets/logo-mark-transparent.png" alt="DIGITECHKH" class="w-full h-full object-contain">
                    </div>
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-xl bg-white/15 backdrop-blur-md w-fit mb-3 border border-white/20">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="text-xs font-medium text-white">ប្រព័ន្ធសុវត្ថិភាពខ្ពស់</span>
                    </div>
                    <h3 class="text-xl font-bold tracking-tight text-white mb-2">
                        ប្រព័ន្ធគ្រប់គ្រងអាជីវកម្ម
                    </h3>
                    <p class="text-xs text-white/80 leading-relaxed font-light">
                        ដំណោះស្រាយគ្រប់គ្រងការលក់ ស្តុកទំនិញ និងរបាយការណ៍ហិរញ្ញវត្ថុប្រកបដោយប្រសិទ្ធភាព
                    </p>
                </div>
            </div>

            <!-- Right Side: Clean Modern Login Form -->
            <div class="p-8 md:p-10 flex flex-col justify-between bg-white">

                <!-- Form Top Header with Cambodia Flag -->
                <div class="flex items-center justify-between pb-1">
                    <div class="flex items-center gap-2.5">
                        <img src="../../assets/logo-mark-transparent.png" alt="DIGITECHKH" class="w-8 h-8 object-contain">
                        <span class="text-sm font-bold tracking-wider text-primary">DIGITECHKH</span>
                    </div>
                    <!-- Cambodia Flag -->
                    <div class="w-7 h-5 rounded overflow-hidden shadow-sm border border-slate-200" title="ភាសាខ្មែរ">
                        <svg viewBox="0 0 16 10" class="w-full h-full">
                            <rect width="16" height="10" fill="#032ea6" />
                            <rect y="2.5" width="16" height="5" fill="#e00025" />
                            <!-- Angkor Wat Silhouette -->
                            <g fill="#ffffff" transform="translate(5, 3) scale(0.6)">
                                <path d="M5 0 L6 2 L6 6 L4 6 L4 2 Z" />
                                <path d="M2 2 L3 3.5 L3 6 L1 6 L1 3.5 Z" />
                                <path d="M8 2 L9 3.5 L9 6 L7 6 L7 3.5 Z" />
                                <rect x="0" y="6" width="10" height="2" />
                            </g>
                        </svg>
                    </div>
                </div>

                <!-- Welcome Title (Centered, No Icon) -->
                <div class="my-5 text-center">
                    <h2 class="text-xl font-bold text-slate-800 tracking-tight">
                        ចូលគណនីរបស់អ្នក
                    </h2>
                    <p class="text-xs text-slate-500 mt-1.5 font-normal">
                        សូមបញ្ចូលលេខទូរស័ព្ទ ឬអ៊ីមែល និងពាក្យសម្ងាត់ដើម្បីបន្ត
                    </p>
                </div>

                <!-- Login Form -->
                <form action="../2-home/dashboard.html" method="GET" class="space-y-4">

                    <!-- Username/Phone/Email Field -->
                    <div>
                        <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">
                            លេខទូរស័ព្ទ ឬអ៊ីមែល <span class="text-rose-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fas fa-user text-sm"></i>
                            </span>
                            <input type="text" id="username" name="username" value="087600064" required
                                placeholder="បញ្ចូលលេខទូរស័ព្ទ ឬអ៊ីមែល"
                                class="w-full bg-slate-50 hover:bg-slate-100/70 focus:bg-white border border-slate-200 hover:border-slate-300 focus:border-primary focus:ring-4 focus:ring-primary/10 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 transition outline-none font-medium placeholder:text-slate-400 placeholder:text-xs placeholder:font-normal" />
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">
                            ពាក្យសម្ងាត់ <span class="text-rose-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fas fa-lock text-sm"></i>
                            </span>
                            <input type="password" id="password" name="password" value="password123" required
                                placeholder="បញ្ចូលពាក្យសម្ងាត់"
                                class="w-full bg-slate-50 hover:bg-slate-100/70 focus:bg-white border border-slate-200 hover:border-slate-300 focus:border-primary focus:ring-4 focus:ring-primary/10 rounded-xl pl-10 pr-10 py-2.5 text-sm text-slate-800 transition outline-none font-medium tracking-wider placeholder:text-slate-400 placeholder:text-xs placeholder:font-normal" />
                            <button type="button" id="togglePasswordBtn"
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition"
                                aria-label="បង្ហាញពាក្យសម្ងាត់">
                                <i class="fas fa-eye text-sm" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Forgot Password Link -->
                    <div class="flex justify-end pt-0.5">
                        <a href="#" class="text-xs font-medium text-emerald-700 hover:text-primary transition-colors">
                            ភ្លេចពាក្យសម្ងាត់?
                        </a>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-2">
                        <button type="submit"
                            class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 text-sm flex items-center justify-center gap-2">
                            <span>ចូលប្រព័ន្ធ</span>
                            <i class="fas fa-arrow-right text-xs"></i>
                        </button>
                    </div>
                </form>

                <!-- Footer notice -->
                <div class="mt-4 pt-3 border-t border-slate-100 text-center">
                    <p class="text-[11px] text-slate-400 font-light">រក្សាសិទ្ធិគ្រប់យ៉ាង © 2026 DIGITECHKH</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Interactive script for password toggle -->
    <script>
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        if (togglePasswordBtn && passwordInput && eyeIcon) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                eyeIcon.classList.toggle('fa-eye', !isPassword);
                eyeIcon.classList.toggle('fa-eye-slash', isPassword);
            });
        }
    </script>
    <script src="../../scripts/ui-components.js"></script>
</body>

</html>
